<style>
/* =========================================================
   SÉLECTEUR DE LANGUE
========================================================= */

.lang-switch {
    display: inline-flex;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--white);

    overflow: hidden;
}

.lang-switch button {
    border: 0;
    background: transparent;

    cursor: pointer;

    padding: 8px 11px;

    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .04em;

    color: var(--muted);

    transition: var(--transition);
}

.lang-switch button:hover {
    color: var(--navy);
}

.lang-switch button[aria-pressed="true"] {
    background: var(--navy);
    color: var(--white);
}

.lang-switch button:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: -2px;
}

/* Évite que la navbar déborde avec le bouton en plus */
@media (min-width: 721px) and (max-width: 1000px) {

    .nav-links {
        gap: 16px;
    }
}
</style>

            "Follow-up and documentation of child protection cases, referral and reporting.",

        "Collecte de données qualitatives, coordination avec les acteurs locaux et synthèse des informations issues des focus groups.":
            "Qualitative data collection, coordination with local stakeholders and synthesis of information from focus groups.",

        /* ---- Compétences ---- */

        "Diplôme de spécialisation en Suivi & Évaluation": "Specialization Diploma in Monitoring & Evaluation",
        "Formation en Travail social": "Social Work Studies",

        "Formations complémentaires.": "Additional training.",
        "Analyse de données avec R — SIPDEC": "Data Analysis with R — SIPDEC",
        "Droit international humanitaire — HLA": "International Humanitarian Law — HLA",
        "Genre & violences — Université de Genève": "Gender & Violence — University of Geneva",
        "Égalité femmes-hommes — OIF": "Gender Equality — OIF",

        /* ---- Contact ---- */
        "Construisons des projets fondés sur les données.": "Let's build data-driven projects.",
        "Disponible pour des missions et collaborations en suivi-évaluation, analyse de données, protection, recherche sociale et projets de développement.":
            "Available for assignments and collaborations in monitoring and evaluation, data analysis, protection, social research and development projects.",
        "Téléphone": "Phone",

        /* ---- Pied de page ---- */

    };


    /* =====================================================
       PARAGRAPHES AVEC BALISES INTERNES
       (titre du hero, paragraphes avec <strong>, etc.)
       Ils sont remplacés en entier via leur sélecteur CSS.
    ===================================================== */

    var HTML_RULES = [

        {
            sel: ".hero h1",
            en: "Turning <em>data</em> into useful decisions."
        },

        {
            sel: ".about-content p:nth-of-type(1)",
            en: "My practice sits at the intersection of " +
                "<strong>social work</strong>, <strong>protection</strong>, " +
                "<strong>public health</strong> and " +
                "<strong>monitoring and evaluation</strong>."
        },

        {
            sel: ".about-content p:nth-of-type(3)",
            en: "My experience with organizations such as " +
                "<strong>UNICEF Haiti</strong>, <strong>FHADIMAC</strong> and " +
                "<strong>ICDH</strong> has allowed me to work directly with " +
                "populations and program teams."
        },

        {
            sel: "#projets .projects-grid article:nth-of-type(1) p",
            en: "Exploratory study carried out as part of the course " +
                "<strong>Data Analysis with SPSS and MS Excel</strong> of the " +
                "SIPDEC specialization program in Monitoring and Evaluation. " +
                "It examines the socio-economic factors and household behaviors " +
                "related to buying medicines sold through the informal market in " +
                "the commune of Jérémie, for the period 2022-2025. " +
                "The objective was to identify the factors associated with the " +
                "use of these medicines and to better understand household " +
                "purchasing and consumption practices."
        }
    ];


    /* =====================================================
       AUTRES ÉLÉMENTS À TRADUIRE
    ===================================================== */

    var TITLE_EN = "Kendy PHILIPPE | Social Work · MEAL · Data";

    var META_EN  = "Professional portfolio of Kendy PHILIPPE — " +
                   "social work, protection, monitoring & evaluation and data analysis.";

    var MENU_LABEL_EN = "Open menu";


    /* =====================================================
       ÉTAT ET OUTILS
    ===================================================== */

    var current = "fr";
    var translatedNodes = [];
    var replacedHtml = [];

    var navLinks   = document.getElementById("navLinks");
    var menuButton = document.getElementById("menuToggle");
    var metaDesc   = document.querySelector('meta[name="description"]');
    var cvLink     = document.querySelector('a[href="CV_Kendy_Philippe.pdf"]');

    // Valeurs françaises d'origine (pour pouvoir revenir en arrière)
    var TITLE_FR = document.title;
    var META_FR  = metaDesc ? metaDesc.getAttribute("content") : null;
    var MENU_LABEL_FR = menuButton ? menuButton.getAttribute("aria-label") : null;
    var CV_FR_URL = cvLink ? cvLink.getAttribute("href") : null;

    function has(obj, key) {
        return Object.prototype.hasOwnProperty.call(obj, key);
    }

    function normalize(text) {
        return text.replace(/\s+/g, " ").trim();
    }

    function getSavedLang() {
        try {
            return window.localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            return null;
        }
    }

    function saveLang(lang) {
        try {
            window.localStorage.setItem(STORAGE_KEY, lang);
        } catch (e) {
            /* stockage indisponible : le choix vaut pour cette visite */
        }
    }


    /* =====================================================
       FRANÇAIS → ANGLAIS
    ===================================================== */

    function toEnglish() {

        // 1) Paragraphes avec balises internes
        HTML_RULES.forEach(function (rule) {

            var el = document.querySelector(rule.sel);
            if (!el) { return; }

            replacedHtml.push({ el: el, html: el.innerHTML });

            el.innerHTML = rule.en;
            el.setAttribute("data-i18n-html", "");
        });

        // 2) Textes simples
        var walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            {
                acceptNode: function (node) {

                    var parent = node.parentNode;
                    if (!parent) { return NodeFilter.FILTER_REJECT; }

                    var tag = parent.nodeName;
                    if (tag === "SCRIPT" || tag === "STYLE" || tag === "NOSCRIPT") {
                        return NodeFilter.FILTER_REJECT;
                    }

                    if (parent.closest &&
                        parent.closest("[data-i18n-html], .lang-switch")) {
                        return NodeFilter.FILTER_REJECT;
                    }

                    return NodeFilter.FILTER_ACCEPT;
                }
            }
        );

        var nodes = [];
        while (walker.nextNode()) { nodes.push(walker.currentNode); }

        var missing = [];

        nodes.forEach(function (node) {

            var raw = node.nodeValue;
            var key = normalize(raw);

            if (!key) { return; }

            if (has(TEXT, key)) {

                var lead  = raw.match(/^\s*/)[0];
                var trail = raw.match(/\s*$/)[0];

                translatedNodes.push({ node: node, fr: raw });
                node.nodeValue = lead + TEXT[key] + trail;

            } else if (DEBUG && /[A-Za-zÀ-ÿ]{3,}/.test(key)) {
                missing.push(key);
            }
        });

        if (DEBUG && missing.length) {
            console.info("[i18n] Textes sans traduction :", missing);
        }
    }


    /* =====================================================
       ANGLAIS → FRANÇAIS
    ===================================================== */

    function toFrench() {

        translatedNodes.forEach(function (item) {
            item.node.nodeValue = item.fr;
        });
        translatedNodes = [];

        replacedHtml.forEach(function (item) {
            item.el.innerHTML = item.html;
            item.el.removeAttribute("data-i18n-html");
        });
        replacedHtml = [];
    }


    /* =====================================================
       APPLIQUER UNE LANGUE
    ===================================================== */

    function setLang(lang, persist) {

        if (lang !== "fr" && lang !== "en") { lang = DEFAULT_LANG; }

        if (lang !== current) {
            if (lang === "en") { toEnglish(); } else { toFrench(); }
            current = lang;
        }

        var isEn = (lang === "en");

        document.documentElement.setAttribute("lang", lang);
        document.title = isEn ? TITLE_EN : TITLE_FR;

        if (metaDesc && META_FR !== null) {
            metaDesc.setAttribute("content", isEn ? META_EN : META_FR);
        }

        if (menuButton && MENU_LABEL_FR !== null) {
            menuButton.setAttribute("aria-label", isEn ? MENU_LABEL_EN : MENU_LABEL_FR);
        }

        if (cvLink && CV_FR_URL !== null) {
            cvLink.setAttribute("href", (isEn && CV_EN_URL) ? CV_EN_URL : CV_FR_URL);
        }

        document.querySelectorAll(".lang-switch button").forEach(function (btn) {
            btn.setAttribute(
                "aria-pressed",
                btn.getAttribute("data-lang") === lang ? "true" : "false"
            );
        });

        if (persist) { saveLang(lang); }
    }


    /* =====================================================
       BOUTON FR | EN (navbar + menu mobile)
    ===================================================== */

    function buildSwitch() {

        if (!navLinks) { return; }

        var item = document.createElement("li");

        item.innerHTML =
            '<div class="lang-switch" role="group" aria-label="Langue / Language">' +
                '<button type="button" data-lang="fr" lang="fr" title="Français" aria-pressed="true">FR</button>' +
                '<button type="button" data-lang="en" lang="en" title="English" aria-pressed="false">EN</button>' +
            '</div>';

        // Placé juste avant le bouton « Contact » (dernier élément du menu)
        navLinks.insertBefore(item, navLinks.lastElementChild);

        item.addEventListener("click", function (event) {

            var btn = event.target.closest("button[data-lang]");
            if (!btn) { return; }

            setLang(btn.getAttribute("data-lang"), true);

            // Referme le menu mobile après le choix
            navLinks.classList.remove("active");
        });
    }


    /* =====================================================
       DÉMARRAGE : français par défaut, sauf choix mémorisé
    ===================================================== */

    buildSwitch();
    setLang(getSavedLang() === "en" ? "en" : "fr", false);

})();
</script>
