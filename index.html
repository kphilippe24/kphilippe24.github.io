    const switcher = document.createElement("div");

    switcher.id = "languageSwitcher";

    switcher.setAttribute(

        "Language selector"
    );

    switcher.innerHTML = `
        <button
            type="button"
            id="langFR"
            class="active"
            aria-label="Français">
            FR
        </button>

        <button
            type="button"
            id="langEN"
            aria-label="English">
            EN
        </button>
    `;

    document.body.appendChild(switcher);


    /* MÉMORISATION DES TEXTES ORIGINAUX */

    const originalTexts = new WeakMap();


    function normalize(text) {
        return text
            .replace(/\s+/g, " ")
            .trim();
    }


    /* RÉCUPÉRATION DES TEXTES VISIBLES */

    function collectTextNodes() {

        const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            {
                acceptNode(node) {

                    if (
                        node.parentElement &&
                        (
                            node.parentElement.closest(
                                "#languageSwitcher"
                            ) ||
                            [
                                "SCRIPT",
                                "STYLE"
                            ].includes(
                                node.parentElement.tagName
                            )
                        )
                    ) {
                        return NodeFilter.FILTER_REJECT;
                    }

                    return normalize(node.nodeValue)
                        ? NodeFilter.FILTER_ACCEPT
                        : NodeFilter.FILTER_REJECT;
                }
            }
        );


        const nodes = [];

        let node;

        while (
            (node = walker.nextNode())
        ) {
            nodes.push(node);
        }

        return nodes;
    }


    /* PASSAGE EN ANGLAIS */

    function translateToEnglish() {

        collectTextNodes().forEach(node => {

            const original =
                originalTexts.get(node) ||
                node.nodeValue;


            if (
                !originalTexts.has(node)
            ) {
                originalTexts.set(
                    node,
                    original
                );
            }


            const key =
                normalize(original);


            if (
                translations[key]
            ) {

                const leading =
                    original.match(/^\s*/)?.[0] ||
                    "";

                const trailing =
                    original.match(/\s*$/)?.[0] ||
                    "";


                node.nodeValue =
                    leading +
                    translations[key] +
                    trailing;
            }

        });


        document.documentElement.lang =
            "en";


        document.title =
            "Kendy PHILIPPE | Social Work · MEAL · Data";


        const meta =
            document.querySelector(
                'meta[name="description"]'
            );


        if (meta) {

            meta.setAttribute(
                "content",
                "Professional portfolio of Kendy PHILIPPE — Social Work, Protection, Monitoring & Evaluation, and Data Analysis."
            );

        }


        document
            .getElementById("langEN")
            .classList
            .add("active");


        document
            .getElementById("langFR")
            .classList
            .remove("active");
    }


    /* RETOUR AU FRANÇAIS */

    function translateToFrench() {

        collectTextNodes().forEach(node => {

            const original =
                originalTexts.get(node);


            if (
                original !== undefined
            ) {

                node.nodeValue =
                    original;

            }

        });


        document.documentElement.lang =
            "fr";


        document.title =
            "Kendy PHILIPPE | Travail social · MEAL · Data";


        const meta =
            document.querySelector(
                'meta[name="description"]'
            );


        if (meta) {

            meta.setAttribute(
                "content",
                "Portfolio professionnel de Kendy PHILIPPE — Travail social, protection, suivi-évaluation et analyse de données."
            );

        }


        document
            .getElementById("langFR")
            .classList
            .add("active");


        document
            .getElementById("langEN")
            .classList
            .remove("active");
    }


    /* ÉVÉNEMENTS */

        .addEventListener(
            "click",
            translateToEnglish
